name: "Publish release"

on:
  push:
    tags:
      - '[0-9].[0-9]+.[0-9]+'

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: false

      - name: Setup Android test SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Publish release to Gradle Plugin Portal
        run: "./gradlew publishPlugins"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
