name: "Validate"
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

jobs:
  validation:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
  build:
    name: "Javaagent Gradle Plugin Validation"
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false

      - name: Setup TestLens
        uses: testlens-app/setup-testlens@v1

      - name: Setup Android test SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Execute Gradle build
        run: ${{ matrix.platform == 'windows-latest' && '.\gradlew.bat' || './gradlew' }} build

      - name: Validate Android Gradle Plugin 8 compatibility
        run: ${{ matrix.platform == 'windows-latest' && '.\gradlew.bat' || './gradlew' }} :android:functionalTest "-PandroidTestAgpVersion=8.13.2"

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-test-reports-${{ matrix.platform }}
          path: |
            android/build/reports/tests/functionalTest/
            android/build/test-results/functionalTest/
          if-no-files-found: ignore
          retention-days: 7
